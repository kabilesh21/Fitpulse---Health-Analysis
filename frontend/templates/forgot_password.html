{% extends "base.html" %}

{% block content %}
<div class="auth-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: 85vh; padding: 2rem 1rem; position: relative; overflow: hidden; width: 100%;">
  <!-- Ambient background glowing blobs -->
  <div class="gemini-glow-orb gemini-glow-1"></div>
  <div class="gemini-glow-orb gemini-glow-2"></div>

  <div class="auth-container" style="max-width: 480px; width: 100%; z-index: 2; background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(226, 232, 240, 0.8); border-radius: 24px; padding: 2.25rem 2rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04); transition: var(--transition);">
    
    <div class="portal-pane active">
      <h2 style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 800; text-align: left; margin: 0; color: var(--text);">
        Reset Password
      </h2>
      <p style="font-size: 13.5px; color: var(--text-2); text-align: left; margin-top: 5px; margin-bottom: 25px;">
        Provide your registered email address to receive a secure recovery link.
      </p>

      <!-- Status Alerts -->
      {% if error %}
      <div class="alert alert-error" style="margin-bottom: 20px; padding: 12px 16px; border-radius: 12px; background: rgba(244, 63, 94, 0.08); color: #f43f5e; font-size: 13.5px; font-weight: 600; border: 1px solid rgba(244, 63, 94, 0.15); display: flex; align-items: center; gap: 8px;">
        <span>❌</span> <span>{{ error }}</span>
      </div>
      {% endif %}
      
      {% if success %}
      <div class="alert alert-success" style="margin-bottom: 20px; padding: 12px 16px; border-radius: 12px; background: rgba(16, 185, 129, 0.08); color: #10b981; font-size: 13.5px; font-weight: 600; border: 1px solid rgba(16, 185, 129, 0.15); display: flex; align-items: center; gap: 8px;">
        <span>✅</span> <span>{{ success }}</span>
      </div>
      {% endif %}

      <form action="/forgot_password" method="POST" style="display: flex; flex-direction: column; gap: 18px;">
        <div class="form-group">
          <label for="recovery-email" class="form-label">Email Address</label>
          <input type="email" id="recovery-email" name="email" class="form-input" placeholder="you@example.com" required autocomplete="email">
        </div>
        
        <button type="submit" class="btn btn-primary btn-full btn-lg" style="margin-top: 10px; background: linear-gradient(135deg, #f97316, #ea580c); border: none; height: 46px; border-radius: 99px; font-weight: 700; font-size: 14.5px; box-shadow: 0 4px 15px rgba(249, 115, 22, 0.2); color: white; cursor: pointer;">
          📩 Send Reset Link
        </button>
      </form>

      <div style="text-align: center; margin-top: 25px; border-top: 1px solid rgba(0,0,0,0.06); padding-top: 20px;">
        <a href="/login" style="font-size: 13.5px; color: var(--text-2); text-decoration: none; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;">
          ← Back to Login
        </a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
